<!doctype html>
<html lang="en">

  <title>BrandChameleon screenshot stage</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e9ebef; font: 13px system-ui, sans-serif; }

    #site { flex: 1; width: 100%; background: #ffffff; }
    #sidebar { width: 400px; height: 100%; border-left: 1px solid #cfd3da; background: #ffffff; }
  </style>
</head>
<body>
  <div class="window">
    <div class="site">
      <div class="bar"><span class="url">https://acme.example/</span></div>
      <iframe id="site" title="Scanned website" src="/tests/fixtures/pages/brand-basic.html"></iframe>

    <iframe id="sidebar" title="BrandChameleon sidebar" src="/src/sidebar/sidebar.html?window=1"></iframe>
